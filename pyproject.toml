[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-security-audit"
version = "2.6.0"
description = "LLM 安全审计工具 - 自动化测试大语言模型的安全边界"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yunzenn" },
]
keywords = ["llm", "security", "audit", "ai-safety", "red-team"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.281; python_version >= '3.10'"]
full = [
    "matplotlib>=3.7.0",
    "plotly>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
llm-audit = "llm_audit.cli:main"

[project.urls]
Homepage = "https://github.com/Yunzenn/LLM-Security-Audit-Demo"
Documentation = "https://github.com/Yunzenn/LLM-Security-Audit-Demo#readme"
Repository = "https://github.com/Yunzenn/LLM-Security-Audit-Demo"
Issues = "https://github.com/Yunzenn/LLM-Security-Audit-Demo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_audit"]

[tool.hatch.build.targets.wheel.force-include]
"attack_payloads" = "llm_audit/data/attack_payloads"
"scenarios/lab_v1.json" = "llm_audit/data/lab_v1.json"
"scenarios/lab_v2_dev.json" = "llm_audit/data/lab_v2_dev.json"
"scenarios/lab_v3_dev.json" = "llm_audit/data/lab_v3_dev.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
